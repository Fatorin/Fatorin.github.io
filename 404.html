<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Hsu, Chen Lin (Rin)</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon-180.png" sizes="180x180" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&family=Noto+Sans+TC:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --paper:#F5F7F6; --ink:#17211F; --body:#33403D; --muted:#5D6E6B; --teal:#2F6F6A; --line:#D4DDDB; }
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--paper); color: var(--body);
  font-family: "IBM Plex Sans", "Noto Sans TC", "Noto Sans JP", sans-serif;
  font-size: 16.5px; line-height: 1.68;
  min-height: 100vh; display: flex; align-items: center;
}
.wrap { max-width: 900px; margin: 0 auto; padding: 0 24px; }
.code {
  font-family: "IBM Plex Mono", monospace; font-size: 12.5px;
  letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  margin-bottom: 20px;
}
h1 {
  font-family: "Space Grotesk", "Noto Sans TC", "Noto Sans JP", sans-serif;
  font-weight: 700; color: var(--ink);
  font-size: clamp(30px, 5vw, 46px); line-height: 1.16;
  letter-spacing: -0.015em; text-wrap: balance; margin-bottom: 18px;
}
p { max-width: 34em; }
a { color: var(--teal); text-decoration: none; border-bottom: 1px solid var(--line); }
a:hover { border-color: var(--teal); }
.back { display: inline-block; margin-top: 28px; font-family: "IBM Plex Mono", monospace; font-size: 13.5px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="code">Error 404</div>
  <h1>This page doesn't exist.</h1>
  <p>The link may be out of date, or the address may have a typo in it. Everything lives on a single page, so the front page is never far away.</p>
  <a class="back" href="/">← back to the portfolio</a>
</div>
</body>
</html>
